services:

  web-app:
    image: devteria/web-app:0.9.1
    container_name: web-app
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}

  identity-service:
    image: devteria/identity-service:0.9.1
    container_name: identity-service
    restart: always
    environment:
      - DBMS_CONNECTION=${DBMS_CONNECTION}
      - DBMS_USERNAME=${DBMS_USERNAME}
      - DBMS_PASSWORD=${DBMS_PASSWORD}

    ports:
      - "8080:8080"
    volumes:
      - "/home/ubuntu/logs:/logs"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: devteria-network
