global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2
scrape_configs:
  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
    - targets:
      - localhost:9090

  - job_name: "Identity Service Metrics"
    scheme: http
    metrics_path: "/identity/app-telemetry/prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["identity-service:8080"]
        labels:
          application: "Identity Service"
